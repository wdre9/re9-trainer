name: 功能建议 / Feature Request
description: 新增功能、改进现有功能或收窄功能范围
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先看 README 的「已知限制」与 CHANGELOG 的 Unreleased 段，
        避免与已知计划重复。

  - type: dropdown
    id: category
    attributes:
      label: 类别
      options:
        - 新增功能（战斗中不存在的能力）
        - 改进现有功能（行为、范围、稳定性）
        - 界面与本地化
        - 配置与调试
        - 文档
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 你希望实现什么
      placeholder: 请描述最终效果，而不是实现步骤。例如「无限投掷物只对投掷物生效，不影响治疗注射器」。
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 为什么需要
      description: 当前行为带来的实际困扰，或与你玩法的冲突点
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 技术线索（可选但强烈建议）
      description: |
        如果涉及具体字段、方法或类型，请附探测证据：
        `dump_type_methods` 输出、`marvis_probe.json` 片段，或截图。
        无证据的字段猜测通常不会被采纳。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      options:
        - label: 该建议仅用于单机离线场景
          required: true
        - label: 我已搜索过现有 Issue，没有重复
          required: true
